<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>

    <!-- Hatch pattern for impossible quadrant -->
    <pattern id="hatch-diagonal" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#EF4444" stroke-width="2.5" opacity="0.14"/>
    </pattern>

    <!-- Soft Gradients for Cards -->
    <linearGradient id="grad-q1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#E2FBEA"/>
    </linearGradient>

    <linearGradient id="grad-q2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <linearGradient id="grad-q3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="grad-q4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FDE8E8"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow-axis-x" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#14497F"/>
    </marker>
    <marker id="arrow-axis-y" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#14497F"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="740" fill="#F8FAFC"/>

  <!-- ==================== HEADER (Generous Top Margin) ==================== -->
  <g transform="translate(45, 22)">
    <rect x="0" y="0" width="6" height="48" fill="#14497F" rx="3"/>
    <text x="18" y="24" font-size="22" font-weight="700" fill="#0F172A">Hubungan Reliabilitas &amp; Validitas Skor</text>
    <text x="18" y="45" font-size="13.5" font-weight="500" fill="#475569">Dua dimensi kualitas inferensi dan pengukuran psikologis (AERA, APA, &amp; NCME, 2014)</text>
  </g>

  <!-- ==================== MAIN 2x2 QUADRANTS CONTAINER (y=112 for comfortable breathing room) ==================== -->
  <g transform="translate(225, 112)">

    <!-- Q4: Top-Left (Impossible / Bound) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="490" height="235" rx="12" fill="url(#grad-q4)" stroke="#FCA5A5" stroke-width="1.8" filter="url(#shadow-card)"/>
      <rect x="0" y="0" width="490" height="235" rx="12" fill="url(#hatch-diagonal)"/>

      <!-- Target Board Graphic: With Slashed Prohibition Symbol -->
      <g transform="translate(70, 115)">
        <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
        <circle cx="0" cy="0" r="38" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="23" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="8" fill="#DC2626"/>
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="3 3"/>
        <!-- Ghosted shots spread around bullseye -->
        <circle cx="-16" cy="-14" r="4.5" fill="#B91C1C" opacity="0.4"/>
        <circle cx="15" cy="18" r="4.5" fill="#B91C1C" opacity="0.4"/>
        <circle cx="-19" cy="16" r="4.5" fill="#B91C1C" opacity="0.4"/>
        <circle cx="21" cy="-12" r="4.5" fill="#B91C1C" opacity="0.4"/>
        <!-- Red Prohibition Ring & Slash -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#DC2626" stroke-width="5" opacity="0.95"/>
        <line x1="-32" y1="-32" x2="32" y2="32" stroke="#DC2626" stroke-width="5" opacity="0.95"/>
      </g>

      <!-- Content -->
      <g transform="translate(145, 16)">
        <rect x="0" y="0" width="180" height="22" rx="11" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
        <text x="90" y="15" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">[ MUSTAHIL SECARA TEORETIS ]</text>
        
        <text x="0" y="44" font-size="16.5" font-weight="700" fill="#991B1B">Mitos: 'Valid tapi Tidak Reliabel'</text>
        <text x="0" y="62" font-size="12" font-weight="600" fill="#DC2626">Area terlarang oleh rumus atenuasi</text>

        <text x="0" y="86" font-size="12" font-weight="600" fill="#7F1D1D">• Rumus atenuasi kriteria: r_XY ≤ √(ρ_XX' · ρ_YY')</text>
        <text x="0" y="106" font-size="12" fill="#450A0A">• Reliabilitas adalah BATAS ATAS bagi validitas kriteria</text>
        <text x="0" y="126" font-size="12" fill="#450A0A">• Skor yang berfluktuasi liar secara matematis tidak bisa</text>
        <text x="0" y="146" font-size="12" fill="#450A0A">  melacak kriteria apapun (buku teks sering keliru!)</text>

        <rect x="0" y="165" width="330" height="26" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
        <text x="10" y="182" font-size="11" font-weight="700" fill="#DC2626">Batas atas: validitas dibatasi oleh reliabilitas skor!</text>
      </g>
    </g>

    <!-- Q1: Top-Right (Ideal: High Rel, High Val) -->
    <g transform="translate(510, 0)">
      <rect x="0" y="0" width="510" height="235" rx="12" fill="url(#grad-q1)" stroke="#86EFAC" stroke-width="1.8" filter="url(#shadow-card)"/>

      <!-- Target Board Graphic: Tightly clustered in bullseye -->
      <g transform="translate(70, 115)">
        <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="0" cy="0" r="38" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="23" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="8" fill="#15803D"/>
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
        <!-- Concentrated shots -->
        <circle cx="-1" cy="2" r="4.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="3" cy="-2" r="4.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="-3" cy="-1" r="4.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="1" cy="4" r="4.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="4" cy="2" r="4.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>

      <!-- Content -->
      <g transform="translate(145, 16)">
        <rect x="0" y="0" width="145" height="22" rx="11" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
        <text x="72.5" y="15" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">[ KUADRAN IDEAL ]</text>
        
        <text x="0" y="44" font-size="16.5" font-weight="700" fill="#14532D">Reliabel &amp; Valid</text>
        <text x="0" y="62" font-size="12" font-weight="600" fill="#16A34A">Tafsiran skor stabil &amp; tepat sasaran</text>

        <text x="0" y="86" font-size="12" fill="#1E293B">• Bebas dari kesalahan acak besar (skor konsisten)</text>
        <text x="0" y="106" font-size="12" fill="#1E293B">• Bebas dari kesalahan sistematis (mengukur konstruk target)</text>
        <text x="0" y="126" font-size="12" fill="#1E293B">• Memenuhi seluruh bukti validitas (isi, struktur, kriteria)</text>
        <text x="0" y="146" font-size="12" fill="#1E293B">• Inferensi &amp; keputusan berbasis skor dapat dipertanggungjawabkan</text>

        <rect x="0" y="165" width="345" height="26" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
        <text x="10" y="182" font-size="11" font-weight="700" fill="#15803D">Kondisi yang dituju dalam pengembangan skala</text>
      </g>
    </g>

    <!-- Q3: Bottom-Left (Low Rel, Low Val) -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="490" height="235" rx="12" fill="url(#grad-q3)" stroke="#CBD5E1" stroke-width="1.8" filter="url(#shadow-card)"/>

      <!-- Target Board Graphic: Scattered Shots Everywhere -->
      <g transform="translate(70, 115)">
        <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="0" cy="0" r="38" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="23" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="8" fill="#64748B"/>
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
        <!-- Wildly scattered shots -->
        <circle cx="-40" cy="22" r="4.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="26" cy="38" r="4.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="-24" cy="-36" r="4.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="42" cy="-22" r="4.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="-8" cy="42" r="4.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>

      <!-- Content -->
      <g transform="translate(145, 16)">
        <rect x="0" y="0" width="150" height="22" rx="11" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
        <text x="75" y="15" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">[ KUALITAS TERENDAH ]</text>
        
        <text x="0" y="44" font-size="16.5" font-weight="700" fill="#334155">TIDAK Reliabel, TIDAK Valid</text>
        <text x="0" y="62" font-size="12" font-weight="600" fill="#64748B">Didominasi kesalahan acak (noise)</text>

        <text x="0" y="86" font-size="12" fill="#475569">• Skor berantakan dan tidak konsisten antar-administrasi</text>
        <text x="0" y="106" font-size="12" fill="#475569">• Mengandung terlalu banyak varians kesalahan acak</text>
        <text x="0" y="126" font-size="12" fill="#475569">• Tidak melacak konstruk target dan tidak stabil</text>
        <text x="0" y="146" font-size="12" fill="#475569">• Skor tidak dapat ditafsirkan dan skala perlu direvisi total</text>

        <rect x="0" y="165" width="330" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="10" y="182" font-size="11" font-weight="700" fill="#475569">Varians eror terlalu besar, item tidak informatif</text>
      </g>
    </g>

    <!-- Q2: Bottom-Right (High Rel, Low Val) -->
    <g transform="translate(510, 250)">
      <rect x="0" y="0" width="510" height="235" rx="12" fill="url(#grad-q2)" stroke="#FCD34D" stroke-width="1.8" filter="url(#shadow-card)"/>

      <!-- Target Board Graphic: Tightly clustered off-target -->
      <g transform="translate(70, 115)">
        <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="0" cy="0" r="38" fill="#FFFDF5" stroke="#FCD34D" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="23" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="8" fill="#D97706"/>
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
        <!-- Clustered in outer ring (top-right corner) -->
        <circle cx="34" cy="-30" r="4.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="38" cy="-27" r="4.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="31" cy="-25" r="4.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="36" cy="-22" r="4.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="41" cy="-24" r="4.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>

      <!-- Content -->
      <g transform="translate(145, 16)">
        <rect x="0" y="0" width="195" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
        <text x="97.5" y="15" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">[ PERINGATAN METODOLOGIS ]</text>
        
        <text x="0" y="44" font-size="16.5" font-weight="700" fill="#92400E">Reliabel, TIDAK Valid</text>
        <text x="0" y="62" font-size="12" font-weight="600" fill="#B45309">Konsisten mengukur hal yang keliru</text>

        <text x="0" y="86" font-size="12" fill="#1E293B">• Skor sangat stabil, berulang, dan konsistensi internal tinggi</text>
        <text x="0" y="106" font-size="12" fill="#1E293B">• Nilai Alpha (α) bisa mendekati 1.0 akibat item berulang/redundant</text>
        <text x="0" y="126" font-size="12" fill="#1E293B">• Terkontaminasi construct-irrelevant variance atau bias sistematis</text>
        <text x="0" y="146" font-size="12" fill="#1E293B">• Contoh: Timbangan yang selalu melebihkan 2 kg pada tiap pengukuran</text>

        <rect x="0" y="165" width="345" height="26" rx="6" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
        <text x="10" y="182" font-size="11.5" font-weight="700" fill="#B45309">Reliabel TIDAK menjamin skor mengukur hal yang benar!</text>
      </g>
    </g>

  </g>

  <!-- ==================== AXES (Sumbu Koordinat) ==================== -->
  
  <!-- Y-AXIS (Left) -->
  <g transform="translate(205, 0)">
    <!-- Main Axis Line with Arrow (From y=605 up to y=100) -->
    <line x1="0" y1="605" x2="0" y2="100" stroke="#14497F" stroke-width="3" marker-end="url(#arrow-axis-y)"/>
    
    <!-- Y-Axis Rotated Labels (Centered at y=350) -->
    <g transform="translate(-75, 350) rotate(-90)">
      <text x="0" y="0" font-size="15" font-weight="700" fill="#14497F" text-anchor="middle">Ketepatan Skor terhadap Konstruk (Validitas)</text>
      <text x="0" y="18" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Semakin ke atas: bebas dari bias &amp; construct-irrelevant variance (melacak konstruk target)</text>
    </g>

    <!-- Y Ticks -->
    <line x1="-8" y1="600" x2="0" y2="600" stroke="#14497F" stroke-width="2"/>
    <text x="-14" y="604" font-size="12" font-weight="600" fill="#475569" text-anchor="end">Rendah</text>

    <line x1="-8" y1="360" x2="0" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="-14" y="364" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Sedang</text>

    <line x1="-8" y1="120" x2="0" y2="120" stroke="#14497F" stroke-width="2"/>
    <text x="-14" y="124" font-size="12" font-weight="700" fill="#15803D" text-anchor="end">Tinggi</text>
  </g>

  <!-- X-AXIS (Bottom) -->
  <g transform="translate(0, 605)">
    <!-- Main Axis Line with Arrow -->
    <line x1="205" y1="0" x2="1255" y2="0" stroke="#14497F" stroke-width="3" marker-end="url(#arrow-axis-x)"/>
    
    <!-- X Ticks -->
    <line x1="225" y1="0" x2="225" y2="8" stroke="#14497F" stroke-width="2"/>
    <text x="225" y="24" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Rendah</text>

    <line x1="735" y1="0" x2="735" y2="8" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="735" y="24" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Ambang Cukup (α ≈ 0.70 / 0.80)</text>

    <line x1="1235" y1="0" x2="1235" y2="8" stroke="#14497F" stroke-width="2"/>
    <text x="1235" y="24" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Tinggi</text>

    <!-- X-Axis Label -->
    <text x="735" y="44" font-size="15" font-weight="700" fill="#14497F" text-anchor="middle">Konsistensi Skor (Reliabilitas) &#8594;</text>
    <text x="735" y="60" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Semakin ke kanan: bebas dari varians kesalahan acak (skor stabil &amp; berulang)</text>
  </g>

</svg>
